name: CI

# ----------------------------------------------------------------------
# When to run
# ----------------------------------------------------------------------
on:
  push:
    branches: [ "main" ]          # Deploy site only from main
  pull_request:
    branches: [ "*" ]

# ----------------------------------------------------------------------
# Global env vars
# ----------------------------------------------------------------------

env:
  PYTHON_VERSION: "3.11"
  UV_CACHE_DIR: "~/.cache/uv"
  NODE_CACHE_DIR: "~/.npm"
  FRONTEND_DIST: "frontend/dist"
  SITE_DIR: "site"

jobs:
  # --------------------------------------------------------------------
  # 1️⃣ Install Python + UV + dev tools, cache UV
  # --------------------------------------------------------------------
  setup-python:
    runs-on: ubuntu-latest
    outputs:
      uv-cache-key: ${{ steps.uv-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV (bootstrap)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache UV packages
        id: uv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Python deps + dev tools
        run: |
          uv sync --frozen
          uv pip install ruff black pytest pytest-cov

  # --------------------------------------------------------------------
  # 2️⃣ Backend lint & format
  # --------------------------------------------------------------------
  lint-format-backend:
    needs: setup-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV (cached)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Restore UV cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ needs.setup-python.outputs.uv-cache-key }}

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run black (format check)
        run: uv run black --check .

  # --------------------------------------------------------------------
  # 3️⃣ Backend tests + coverage (HTML + XML)
  # --------------------------------------------------------------------
  test-backend:
    needs: setup-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV (cached)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Restore UV cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ needs.setup-python.outputs.uv-cache-key }}

      - name: Run pytest with coverage
        run: |
          mkdir -p coverage/backend
          uv run pytest --cov=app \
            --cov-report=html:coverage/backend \
            --cov-report=xml:coverage/backend/coverage.xml

      - name: Upload backend coverage HTML (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: coverage/backend
          retention-days: 7

  # --------------------------------------------------------------------
  # 4️⃣ Frontend setup (npm install) – cache
  # --------------------------------------------------------------------
  setup-frontend:
    runs-on: ubuntu-latest
    outputs:
      node-modules-key: ${{ steps.node-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm packages
        id: node-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NODE_CACHE_DIR }}
          key: node-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

  # --------------------------------------------------------------------
  # 5️⃣ Frontend lint & format
  # --------------------------------------------------------------------
  lint-format-frontend:
    needs: setup-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NODE_CACHE_DIR }}
          key: ${{ needs.setup-frontend.outputs.node-modules-key }}

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier format check
        working-directory: frontend
        run: npm run format:check

  # --------------------------------------------------------------------
  # 6️⃣ Frontend tests + coverage (Vitest)
  # --------------------------------------------------------------------
  test-frontend:
    needs: setup-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NODE_CACHE_DIR }}
          key: ${{ needs.setup-frontend.outputs.node-modules-key }}

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Run Vitest with coverage
        working-directory: frontend
        run: |
          npm run test -- --coverage

      - name: Upload frontend coverage HTML (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-html
          path: frontend/coverage
          retention-days: 7

  # --------------------------------------------------------------------
  # 7️⃣ Build frontend assets (Vite) for deployment
  # --------------------------------------------------------------------
  build-frontend:
    needs: [setup-frontend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NODE_CACHE_DIR }}
          key: ${{ needs.setup-frontend.outputs.node-modules-key }}

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Build production assets
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------------------------
  # 8️⃣ Assemble site folder (frontend + both coverage reports)
  # --------------------------------------------------------------------
  assemble-site:
    needs: [test-backend, test-frontend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-html
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-html
          path: coverage/frontend

      - name: Copy built assets
        run: |
          rm -rf ${{ env.SITE_DIR }}
          mkdir -p ${{ env.SITE_DIR }}/frontend
          cp -r ${{ env.FRONTEND_DIST }}/* ${{ env.SITE_DIR }}/frontend/

      - name: Add coverage reports
        run: |
          mkdir -p ${{ env.SITE_DIR }}/coverage
          cp -r coverage/backend ${{ env.SITE_DIR }}/coverage/backend
          cp -r coverage/frontend ${{ env.SITE_DIR }}/coverage/frontend

      - name: Deploy site (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SITE_DIR }}
          force_orphan: true
          keep_files: false

  # --------------------------------------------------------------------
  # 9️⃣ Post a status comment on PR / commit
  # --------------------------------------------------------------------
  notify:
    needs: [lint-format-backend, test-backend, lint-format-frontend, test-frontend, build-frontend, assemble-site]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Post CI status comment
        uses: actions/github-script@v7
        with:
          script: |
            const { context, github } = require('@actions/github');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const conclusion = context.workflow && context.workflow === 'success' ? '✅ Success' : '❌ Failure';
            const message = `CI workflow finished. ${conclusion}\nRun details: ${runUrl}`;
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            } else {
              await github.rest.repos.createCommitComment({
                ...context.repo,
                commit_sha: context.sha,
                body: message
              });
            }
