name: CI

# ----------------------------------------------------------------------
# When to run
# ----------------------------------------------------------------------
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

# ----------------------------------------------------------------------
# Permissions
# ----------------------------------------------------------------------
permissions:
  contents: write
  pull-requests: write
  issues: write

# ----------------------------------------------------------------------
# Global env vars
# ----------------------------------------------------------------------
env:
  PYTHON_VERSION: "3.11"
  FRONTEND_DIST: "frontend/dist"
  SITE_DIR: "site"

jobs:
  # --------------------------------------------------------------------
  # 1️⃣ Backend Lint & Format
  # --------------------------------------------------------------------
  lint-format-backend:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (setup-python)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run black (format check)
        run: uv run black --check .

  # --------------------------------------------------------------------
  # 2️⃣ Backend Tests & Coverage
  # --------------------------------------------------------------------
  test-backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (setup-python)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage
        run: |
          mkdir -p coverage/backend
          uv run pytest --cov=app \
            --cov-report=html:coverage/backend \
            --cov-report=xml:coverage/backend/coverage.xml

      - name: Upload backend coverage HTML (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: coverage/backend
          retention-days: 7

  # --------------------------------------------------------------------
  # 3️⃣ Frontend Lint & Format
  # --------------------------------------------------------------------
  lint-format-frontend:
    name: Frontend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier format check
        working-directory: frontend
        run: npm run format:check

  # --------------------------------------------------------------------
  # 4️⃣ Frontend Tests & Coverage
  # --------------------------------------------------------------------
  test-frontend:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test -- --coverage

      - name: Upload frontend coverage HTML (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-html
          path: frontend/coverage
          retention-days: 7

  # --------------------------------------------------------------------
  # 5️⃣ Build Frontend Assets
  # --------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Build production assets
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIST }}
          retention-days: 7

  # --------------------------------------------------------------------
  # 6️⃣ Assemble Site & Deploy (GitHub Pages)
  # --------------------------------------------------------------------
  assemble-site:
    name: Assemble Site & Deploy
    needs: [test-backend, test-frontend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-html
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-html
          path: coverage/frontend

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIST }}

      - name: Assemble site directory
        run: |
          rm -rf ${{ env.SITE_DIR }}
          mkdir -p ${{ env.SITE_DIR }}/frontend
          mkdir -p ${{ env.SITE_DIR }}/coverage
          cp -r ${{ env.FRONTEND_DIST }}/* ${{ env.SITE_DIR }}/frontend/
          cp -r coverage/backend ${{ env.SITE_DIR }}/coverage/backend
          cp -r coverage/frontend ${{ env.SITE_DIR }}/coverage/frontend

      - name: Deploy site to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SITE_DIR }}
          force_orphan: true
          keep_files: false

  # --------------------------------------------------------------------
  # 7️⃣ Notification (Comment on PR / commit)
  # --------------------------------------------------------------------
  notify:
    name: CI Status Notification
    needs: [lint-format-backend, test-backend, lint-format-frontend, test-frontend, build-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Post CI status comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobResults = [
              '${{ needs.lint-format-backend.result }}',
              '${{ needs.test-backend.result }}',
              '${{ needs.lint-format-frontend.result }}',
              '${{ needs.test-frontend.result }}',
              '${{ needs.build-frontend.result }}'
            ];
            const isSuccess = jobResults.every(r => r === 'success');
            const conclusion = isSuccess ? '✅ Success' : '❌ Failure';
            const message = `CI workflow finished: ${conclusion}\nRun details: ${runUrl}`;

            try {
              if (context.payload.pull_request) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: context.payload.pull_request.number,
                  body: message
                });
              } else {
                await github.rest.repos.createCommitComment({
                  ...context.repo,
                  commit_sha: context.sha,
                  body: message
                });
              }
            } catch (err) {
              console.log('Posting notification comment was skipped or failed:', err.message);
            }
