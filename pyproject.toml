[project]
name = "mhd-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".git", ".venv", "frontend", "certs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | frontend
  | certs
)/
'''

